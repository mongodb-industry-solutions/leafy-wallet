name: Backend Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ensure Atlas credentials are configured
        run: |
          if [ -z "${{ secrets.MONGODB_URI }}" ]; then
            echo "::error::MONGODB_URI secret is not set. Tests would silently skip instead of running — add the repo secret first."
            exit 1
          fi

      - name: Run tests
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          APP_NAME: leafy-wallet-ci
        run: uv run pytest -v
