name: Frontend Tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

# package-lock.json is committed, so jobs install with `npm ci`: reproducible, and it matches what
# the Dockerfile and local dev already resolve against. Resolving from scratch instead crashes the
# npm 10 that ships with Node 22 ("Cannot read properties of null (reading 'edgesOut')").
env:
  NODE_VERSION: "22"

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tests/unit only. The tests/ai evals drive a real Ollama model, which no runner has.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e:
    name: E2E user workflows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        env:
          APP_NAME: leafy-wallet
          ENV_NAME: local
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
