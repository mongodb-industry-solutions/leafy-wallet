security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: ainhoa.mugica@mongodb.com

# The PSP URLs point at the staging Leafy Pay, the only one where this OAuth client is registered.
env:
  NODE_ENV: prod
  APP_ENV: prod
  AWS_REGION: us-east-1
  BACKEND_URL: http://localhost:8000
  LOCAL_STORE_URL: http://localhost:8090
  OLLAMA_BASE_URL: http://localhost:11434
  APP_BASE_URL: https://leafy-wallet-frontend.industrysolutions.prod.corp.mongodb.com
  PSP_BASE_URL: https://sec-fsi-pci-dss-backend.industrysolutions.staging.corp.mongodb.com
  PSP_FRONTEND_URL: https://sec-fsi-pci-dss-frontend.industrysolutions.staging.corp.mongodb.com

# Secret names only, never values. Set them with `helm ksec set leafy-wallet-kanopy ...`.
envSecrets:
  MONGODB_URI: leafy-wallet-kanopy
  DATABASE_NAME: leafy-wallet-kanopy
  CLIENT_ID: leafy-wallet-kanopy
  CLIENT_SECRET: leafy-wallet-kanopy
  SESSION_SECRET: leafy-wallet-kanopy
  GROVE_API_KEY: leafy-wallet-kanopy

# Order matters: .drone.yml overrides these by index.
sidecarContainers:
  - name: backend
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-wallet-backend:latest
    containerPort: 8000
    env:
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: leafy-wallet-kanopy
            key: MONGODB_URI
      - name: DATABASE_NAME
        valueFrom:
          secretKeyRef:
            name: leafy-wallet-kanopy
            key: DATABASE_NAME
      - name: OLLAMA_BASE_URL
        value: http://localhost:11434

  - name: ollama
    image: ollama/ollama:0.32.0
    command: ["/bin/sh", "-c"]
    args:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull nomic-embed-text
        wait
    volumeMounts:
      - name: ollama-models
        mountPath: /root/.ollama

  - name: leafy-local-store
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-wallet-local-store:latest
    env:
      - name: OLLAMA_BASE_URL
        value: http://localhost:11434
      - name: SYNC_SERVER_URL
        value: ws://localhost:9999
    volumeMounts:
      - name: local-store-data
        mountPath: /app/local-store-db

  - name: objectbox-sync-server
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-wallet-objectbox-sync:2026-07-14
    args:
      - --model
      - /model/objectbox-model.json
      - --unsecured-no-authentication
      - --admin-bind
      - 0.0.0.0:9980
      - --mongo-url
      - $(MONGODB_URI)
      - --mongo-db
      - $(DATABASE_NAME)
      - --mongo-initial-import
    env:
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: leafy-wallet-kanopy
            key: MONGODB_URI
      - name: DATABASE_NAME
        valueFrom:
          secretKeyRef:
            name: leafy-wallet-kanopy
            key: DATABASE_NAME
    volumeMounts:
      - name: sync-server-data
        mountPath: /data
      - name: objectbox-model
        mountPath: /model
        readOnly: true

# objectbox-model comes from a ConfigMap created by hand; recreate it when the schema changes.
extraVolumes:
  - name: ollama-models
    emptyDir: {}
  - name: local-store-data
    emptyDir: {}
  - name: sync-server-data
    emptyDir: {}
  - name: objectbox-model
    configMap:
      name: leafy-wallet-objectbox-model

serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"
