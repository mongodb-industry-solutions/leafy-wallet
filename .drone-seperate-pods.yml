        - "image.tag=git-${DRONE_COMMIT_SHA:0:7}-prod"
        - "image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/<your-demo-name>-frontend-prod"
        - "ingress.enabled=true"
        - "ingress.hosts[0]=<your-demo-name>-frontend.industrysolutions.prod.corp.mongodb.com"
        - "mesh.enabled=true"
        # Frontend resources (production - slightly higher for reliability)
        - "resources.limits.cpu=500m"
        - "resources.limits.memory=512Mi"
        - "resources.requests.cpu=150m"
        - "resources.requests.memory=256Mi"
      api_server: https://api.prod.corp.mongodb.com
      kubernetes_token:
        from_secret: production_kubernetes_token
