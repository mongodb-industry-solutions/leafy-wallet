[project]
name = "leafy-wallet-sync-env"
version = "0.1.0"
description = "Leafy Wallet Atlas Sync"
authors = [{name = "Felipe Trejos", email = "felipe.trejos@mongodb.com"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymongo>=4.10.1",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.2",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
