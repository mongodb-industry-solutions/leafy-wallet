services:
  ollama:
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    container_name: leafy-wallet-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
  ollama-pull:
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    container_name: leafy-wallet-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: "no"
  objectbox-sync-server:
    image: objectboxio/sync-server-trial
    container_name: leafy-wallet-objectbox-sync
    env_file:
      - backend/.env
    ports:
      - "9980:9980"  # Admin UI - activate the trial license here
      - "9999:9999"  # Sync protocol port for leafy-local-store
    volumes:
      - ./objectbox-sync-server:/data
    working_dir: /data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /sync-server \
          --model objectbox-model.json \
          --unsecured-no-authentication \
          --admin-bind 0.0.0.0:9980 \
          --mongo-url "$$MONGODB_URI" \
          --mongo-db "$$DATABASE_NAME"
    restart: always
  leafy-local-store:
    build:
      context: ./leafy-local-store
    container_name: leafy-wallet-local-store
    ports:
      - "8090:8090"
    volumes:
      - leafy_local_store_data:/app/local-store-db
    depends_on:
      objectbox-sync-server:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - SYNC_SERVER_URL=ws://objectbox-sync-server:9999
    restart: always
  demoname-backend:
    build:
      context: .
      no_cache: true
      dockerfile: Dockerfile.backend
    image: imagename-backend:latest
    volumes:
      - ~/.aws/credentials:/root/.aws/credentials:ro
      - ~/.aws/config:/root/.aws/config:ro
      - ~/.aws/sso/cache:/root/.aws/sso/cache:rw  # Only make cache writable
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: always
    container_name: demoname-backend
  demoname-frontend:
    build:
      context: .
      no_cache: true
      dockerfile: Dockerfile.frontend
    image: imagename-frontend:latest
    ports:
      - "3000:3000"
    restart: always
    container_name: demoname-frontend

volumes:
  ollama_data:
  leafy_local_store_data: