services:
  ollama:
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    container_name: leafy-wallet-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    restart: always
  ollama-pull:
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    container_name: leafy-wallet-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:7b"]
    restart: "no"
  leafy-embed:
    build:
      context: ./leafy-embed
    container_name: leafy-wallet-embed
    ports:
      - "8091:8091"
    restart: always
  # Falls back to the public trial image
  objectbox-sync-server:
    image: ${OBJECTBOX_SYNC_IMAGE:-objectboxio/sync:sync-server-2026-07-14}
    container_name: leafy-wallet-objectbox-sync
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - backend/.env
    ports:
      - "9980:9980"
      - "9999:9999"
    volumes:
      - ./objectbox-sync-server:/data
    working_dir: /data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /sync-server \
          --model objectbox-model.json \
          --unsecured-no-authentication \
          --admin-bind 0.0.0.0:9980 \
          --mongo-url "$$MONGODB_URI" \
          --mongo-db "$$DATABASE_NAME" \
          --mongo-initial-import
    restart: always
  leafy-local-store:
    build:
      context: ./leafy-local-store
    container_name: leafy-wallet-local-store
    ports:
      - "8090:8090"
    volumes:
      - leafy_local_store_data:/app/local-store-db
    depends_on:
      objectbox-sync-server:
        condition: service_started
      leafy-embed:
        condition: service_healthy
    environment:
      - EMBEDDINGS_URL=http://leafy-embed:8091
      - SYNC_SERVER_URL=ws://objectbox-sync-server:9999
    restart: always
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: leafy-wallet-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - EMBEDDINGS_URL=http://leafy-embed:8091
    depends_on:
      leafy-embed:
        condition: service_healthy
    restart: always
    container_name: leafy-wallet-backend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: leafy-wallet-frontend:latest
    ports:
      - "8080:8080"
    env_file:
      - frontend/.env.local
    environment:
      - BACKEND_URL=http://backend:8000
      - LOCAL_STORE_URL=http://leafy-local-store:8090
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBEDDINGS_URL=http://leafy-embed:8091
    depends_on:
      backend:
        condition: service_started
      leafy-local-store:
        condition: service_started
      ollama:
        condition: service_started
      leafy-embed:
        condition: service_healthy
    restart: always
    container_name: leafy-wallet-frontend

volumes:
  ollama_data:
  leafy_local_store_data: